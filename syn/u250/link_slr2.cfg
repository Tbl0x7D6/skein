# 和 link_slr0.cfg 一样，但把 CU 钉到 SLR2、数据走 DDR[1]。
#
# 平台的三个 DDR4 子系统按 preopt.tcl 的 pblock 分别落在 SLR0（mem00/DDR[0]）、
# SLR2（mem01/DDR[1]）、SLR3（mem02/DDR[2]）。SLR0 同时装着 XDMA、interconnect
# 和 clkwiz，是最挤的一个（CLB 利用率约 28%）；SLR2 只有约 6%，SLR3 几乎空的。
# 主链接和 slr0 备用链接都在 SLR0 里堵着（拥堵等级 6、几小时不收敛），所以把
# 核整个搬到空 SLR 上试一次：核和它的 DDR 在同一个 SLR 里，数据不跨 SLR。

[connectivity]
slr=SK_afu_1:SLR2
sp=SK_afu_1.m_axi_gmem:DDR[1]
