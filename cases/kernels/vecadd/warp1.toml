# vecadd 的单 warp 版本：4 lane、n = 4，每个 lane 一个元素（RTL 端到端跑）
program = "vecadd.s"
warpsz = 4
nwarp = 1
block_dim = 4

[sreg]
PTR_A = 0x1000
PTR_B = 0x2000
PTR_C = 0x3000
ARG0 = 4

[[init]]
space = "gmem"
addr = 0x1000
gen = "vecadd_a"
args = { n = 4 }

[[init]]
space = "gmem"
addr = 0x2000
gen = "vecadd_b"
args = { n = 4 }

[[check]]
space = "gmem"
addr = 0x3000
words = 4

[expect]
status = "OK"
